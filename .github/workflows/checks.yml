name: Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399
      - run: nix develop --command bash tests/test_nix.sh
      - run: nix develop --command bash tests/test_packaging.sh
      - run: nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck --command actionlint
      - run: nix shell --inputs-from . nixpkgs#shellcheck --command shellcheck packaging/*.sh packaging/*/*.sh tests/test_packaging.sh
      - name: Build and test the player
        run: |
          nix develop --command bash -euc '
            cargo fmt --all -- --check
            meson setup _builddir . -Dprofile=development
            meson compile -C _builddir -j4
            cargo test --target-dir _builddir/src -- --test-threads=1
            cargo test -p hopea-spotify --target-dir _builddir/src
            meson test -C _builddir --suite import --print-errorlogs
          '
      - run: nix develop --command cargo test --manifest-path common/Cargo.toml
      - run: nix develop --command cargo test --manifest-path node/Cargo.toml
