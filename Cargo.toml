[package]
name = "hopea"
authors = ["Emmanuele Bassi <ebassi@gnome.org>"]
version = "0.1.0"
repository = "https://github.com/PuffyWithEyes/Hopea"
edition = "2018"

[dependencies]
hopea-common = { path = "common" }
hopea-node = { path = "node" }
color-thief = "0.2.2"
gdk-pixbuf = { version = "0.22.0", features = ["v2_42"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
hex = "0.4.3"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_16"] }
itertools = "0.15.0"
# Compressed ID3 frames can expand outside the input byte budget.
lofty = { version = "0.25.5", default-features = false }
log = "0.4.34"
once_cell = "1.21.4"
pretty_env_logger = "0.5.0"
rand = { version = "0.10.3", features = ["thread_rng"]}
regex = "1.13.1"
strsim = "0.11.1"
unicode-normalization = "0.1.26"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
fuzzy-matcher = "0.3.7"
percent-encoding = "2.3.2"
soup3 = "0.9.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
# Lets the built-in node's log messages reach the app's logger
tracing = { version = "0.1.44", features = ["log"] }
async-channel = "2.5.0"
futures = "0.3.34"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Native tray/menu from Tauri; GTK runs the platform event loop.
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by the native tray; no game-monitoring SDK or privileged helper.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSURL"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
# MPRIS and the tray icon talk D-Bus, which other systems don't have
mpris-server = "0.11.0"
# Tray icon while sharing music (StatusNotifierItem)
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = {version = "0.13.13", default-features = false, features = ["gtk4", "background", "async-io"]}
# Finds the interface the internet is reached through, to tell a VPN
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly", target_os = "macos"))'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["net"] }

[dependencies.adw]
package = "libadwaita"
version = "0.9.2"
features = ["v1_6"]

[dependencies.gst]
package = "gstreamer"
version = "0.25.4"

[dependencies.gst-audio]
package = "gstreamer-audio"
version = "0.25.4"

[dependencies.gst-play]
package = "gstreamer-play"
version = "0.25.0"

# Dependencies are built without debug information: it takes most of the
# space of a debug build, and debugging rarely needs to step into them
[profile.dev.package."*"]
debug = false

[workspace]
resolver = "2"
members = ["spotify"]
exclude = ["common", "node", "vendor/lofty", "vendor/socket-pktinfo", "vendor/librqbit-dualstack-sockets", "vendor/librqbit", "vendor/dontfrag"]
default-members = ["."]

[patch.crates-io]
dontfrag = { path = "vendor/dontfrag" }
librqbit = { path = "vendor/librqbit" }
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
# Pinned upstream source with the no-compression build fix (see node/README.md).
lofty = { path = "vendor/lofty" }

socket-pktinfo = { path = "vendor/socket-pktinfo" }
