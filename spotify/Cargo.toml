[package]
name = "hopea-spotify"
version = "0.1.0"
edition = "2021"
publish = false

# Build separately from the player: librespot's governor clock features are
# incompatible with librqbit's. No GTK, node, Connect or discovery in this binary.
[dependencies]
hopea-common = { path = "../common" }
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-audio = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "signal", "time"] }
